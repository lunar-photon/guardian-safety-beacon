name: Build Android APK

# Builds the debug APK in the cloud so you don't need any local toolchain.
# Runs on every push to the android project, and can be run on demand from the
# Actions tab (Run workflow). Download the APK from the run's "Artifacts".

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME set,
      # platforms;android-34 + build-tools present), so no setup-android needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
