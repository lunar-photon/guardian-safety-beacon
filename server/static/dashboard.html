<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardian — Live Telemetry</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg-base: #090d16;
    --card-bg: rgba(15, 23, 42, 0.88);
    --card-border: rgba(255, 255, 255, 0.12);
    --txt-main: #f8fafc;
    --txt-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --online-green: #22c55e;
    --offline-red: #ef4444;
    --warn-amber: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-base); color: var(--txt-main); }

  #map {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    background: #0f172a;
  }

  /* Live Pulsing Dot Marker */
  .custom-beacon-icon {
    background: transparent;
    border: none;
  }
  .live-beacon {
    position: relative;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .live-beacon-core {
    width: 14px;
    height: 14px;
    background: #2563eb;
    border: 2.5px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 14px rgba(37, 99, 235, 0.9), 0 2px 5px rgba(0,0,0,0.4);
    z-index: 2;
  }
  .live-beacon-ring {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: rgba(37, 99, 235, 0.28);
    border: 1.5px solid rgba(59, 130, 246, 0.6);
    animation: live-beacon-pulse 2s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes live-beacon-pulse {
    0% { transform: scale(0.35); opacity: 0.95; }
    70% { transform: scale(1.35); opacity: 0.2; }
    100% { transform: scale(1.75); opacity: 0; }
  }

  /* Floating Left HUD */
  .hud-panel {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 1000;
    width: min(92vw, 360px);
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    transition: all 0.3s ease;
  }

  .hud-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .hud-title-box {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .device-icon {
    font-size: 20px;
    background: rgba(255, 255, 255, 0.08);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .device-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--txt-main);
    letter-spacing: -0.01em;
  }
  .device-id {
    font-size: 11px;
    color: var(--txt-muted);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #4ade80;
  }
  .status-badge.offline {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.3);
    color: #f87171;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .metric-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .metric-label {
    font-size: 11px;
    color: var(--txt-muted);
    margin-bottom: 2px;
  }
  .metric-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--txt-main);
  }

  /* Separate Actions Row */
  .actions-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn-action {
    flex: 1;
    min-width: 65px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 9px 8px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    color: var(--txt-main);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-action:hover {
    background: rgba(255, 255, 255, 0.14);
    border-color: var(--accent);
  }
  .btn-action.active {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: #ffffff;
  }
  .btn-primary {
    background: #2563eb;
    border-color: #3b82f6;
    color: #ffffff;
  }
  .btn-primary:hover {
    background: #1d4ed8;
  }

  /* Bottom Drawer Toggle */
  .drawer-toggle {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 30px;
    padding: 8px 20px;
    color: var(--txt-main);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    transition: all 0.2s;
  }
  .drawer-toggle:hover {
    border-color: var(--accent);
  }

  /* Slide-Up Bottom Drawer */
  .drawer-panel {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 52vh;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--card-border);
    z-index: 1001;
    transform: translateY(105%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    padding: 16px 24px 28px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -12px 36px rgba(0,0,0,0.5);
  }
  .drawer-panel.open {
    transform: translateY(0);
  }
  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .tab-buttons {
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, 0.06);
    padding: 3px;
    border-radius: 10px;
  }
  .tab-btn {
    padding: 5px 12px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--txt-muted);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    font-weight: 600;
  }
  .drawer-close {
    background: transparent;
    border: none;
    color: var(--txt-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
  }

  .drawer-body {
    overflow-y: auto;
    max-height: 40vh;
    padding-bottom: 8px;
  }
  .drawer-body::-webkit-scrollbar { width: 5px; height: 5px; }
  .drawer-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

  /* Photos Scroll */
  .photos-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .photo-thumb {
    flex-shrink: 0;
    width: 130px;
    height: 170px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    object-fit: cover;
    background: #0b1220;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .photo-thumb:hover {
    transform: scale(1.03);
    border-color: var(--accent);
  }

  /* Activity events */
  .event-item {
    display: flex;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .event-item.critical { border-left: 3px solid var(--offline-red); }
  .event-item.warn { border-left: 3px solid var(--warn-amber); }
  .event-item.info { border-left: 3px solid var(--accent); }
  .event-icon { font-size: 14px; margin-top: 1px; }
  .event-content { flex: 1; }
  .event-title { color: var(--txt-main); font-weight: 500; }
  .event-time { color: var(--txt-muted); font-size: 11px; margin-top: 1px; }

  /* Lightbox Modal */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 3000;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #lightbox.active { display: flex; }
  .lightbox-content {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 28px;
    font-size: 28px;
    color: #ffffff;
    background: transparent;
    border: none;
    cursor: pointer;
  }

  /* Toast Notification */
  #toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4000;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 13px;
    color: #fff;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="map"></div>

<!-- Single HUD Box: Device Info & Location -->
<div class="hud-panel" id="hud">
  <div class="hud-header">
    <div class="hud-title-box">
      <div class="device-icon">📱</div>
      <div>
        <div class="device-title" id="devName">My Weather Phone</div>
        <div class="device-id" id="devId">dev-6b80ca5a</div>
      </div>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Live</span>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">Coordinates</div>
      <div class="metric-val" id="valCoords">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Accuracy</div>
      <div class="metric-val" id="valAcc">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Battery</div>
      <div class="metric-val" id="valBat">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Last Signal</div>
      <div class="metric-val" id="valAgo">Just now</div>
    </div>
  </div>

  <div class="actions-row">
    <button class="btn-action btn-primary" onclick="centerOnDevice()" title="Center map on live location">
      🎯 Center
    </button>
    <button class="btn-action" id="trailBtn" onclick="toggleTrail()" title="Toggle historical route trail">
      📍 Trail
    </button>
    <button class="btn-action" onclick="sendSnapshot()" title="Capture photo remotely">
      📸 Snapshot
    </button>
    <button class="btn-action" id="rateBtn" onclick="cycleTrackingRate()" title="Click to adjust tracking interval">
      ⏱️ Rate: <span id="rateLabel">10s</span>
    </button>
    <button class="btn-action" onclick="ringDevice()" title="Ring the phone">
      🔔 Ring
    </button>
  </div>
</div>

<!-- Bottom Drawer Button -->
<button class="drawer-toggle" id="drawerBtn" onclick="toggleDrawer()">
  📷 Photos & Activity (<span id="photoCount">0</span>)
</button>

<!-- Bottom Drawer: Activity & Photos -->
<div class="drawer-panel" id="drawer">
  <div class="drawer-header">
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabPhotosBtn" onclick="switchDrawerTab('photos')">📸 Photos (<span id="drawerPhotoCount">0</span>)</button>
      <button class="tab-btn" id="tabEventsBtn" onclick="switchDrawerTab('events')">⚡ Activity (<span id="eventCount">0</span>)</button>
    </div>
    <button class="drawer-close" onclick="toggleDrawer()">✕</button>
  </div>

  <div class="drawer-body">
    <div id="photosView">
      <div class="photos-scroll" id="photosContainer">
        <p style="color:var(--txt-muted);font-size:12px;padding:20px 0;">No snapshots received yet. Click "📸 Snapshot" to capture.</p>
      </div>
    </div>
    <div id="eventsView" style="display: none;">
      <div id="eventsList">
        <p style="color:var(--txt-muted);font-size:12px;padding:20px 0;">No activity recorded yet.</p>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox Modal -->
<div id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" class="lightbox-content" src="" alt="Full snapshot">
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const LS_TOKEN_KEY = "guardian_token";
let TOKEN = "";
let map, beaconMarker = null, accuracyCircle = null, trailPolyline = null;
let showTrail = false;
let currentDevice = null;
let hasAutoCentered = false;
let drawerOpen = false;
let currentRateSec = 10;
const rateOptions = [5, 10, 30, 60, 300];

// Injected token from server or URL query param or localStorage
const urlParams = new URLSearchParams(window.location.search);
const injectedToken = "__DEFAULT_TOKEN__";
TOKEN = urlParams.get("token") || (!injectedToken.startsWith("__") ? injectedToken : "") || localStorage.getItem(LS_TOKEN_KEY) || "";

if (TOKEN) {
  localStorage.setItem(LS_TOKEN_KEY, TOKEN);
}

// Initialize map & telemetry
initMap();
refreshState();
connectWebSocket();
setInterval(refreshState, 5000);

function initMap() {
  map = L.map("map", {
    zoomControl: false,
    attributionControl: false
  }).setView([20, 0], 2);

  // 100% Free Open-Source OpenStreetMap Tiles (No API key needed)
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  L.control.zoom({ position: "bottomright" }).addTo(map);
}

const beaconIcon = L.divIcon({
  className: "custom-beacon-icon",
  html: '<div class="live-beacon"><div class="live-beacon-ring"></div><div class="live-beacon-core"></div></div>',
  iconSize: [24, 24],
  iconAnchor: [12, 12]
});

async function refreshState() {
  try {
    const res = await fetch("/api/state", {
      headers: { Authorization: "Bearer " + TOKEN }
    });
    if (!res.ok) return;
    const data = await res.json();
    if (!data.devices || data.devices.length === 0) return;

    const dev = data.devices.find(d => d.id === "dev-6b80ca5a") || data.devices[0];
    currentDevice = dev;
    updateHUD(dev, data.now, data.offline_timeout);
    updateLocationOnMap(dev);
    updateEvents(data.events || []);
    updatePhotos(data.frames || []);
  } catch (err) {
    console.error("Refresh error:", err);
  }
}

function updateHUD(d, now, timeout) {
  document.getElementById("devName").textContent = d.name || "Device";
  document.getElementById("devId").textContent = d.id;

  const lp = d.last_ping || {};
  const fx = d.last_fix || lp;

  const isOnline = (now - (d.last_seen || 0)) < (timeout || 90);
  const badge = document.getElementById("statusBadge");
  const statusText = document.getElementById("statusText");

  if (isOnline) {
    badge.className = "status-badge";
    statusText.textContent = "Live";
  } else {
    badge.className = "status-badge offline";
    statusText.textContent = "Offline";
  }

  // Coordinates
  if (fx && fx.lat != null) {
    const latStr = Math.abs(fx.lat).toFixed(5) + "° " + (fx.lat >= 0 ? "N" : "S");
    const lonStr = Math.abs(fx.lon).toFixed(5) + "° " + (fx.lon >= 0 ? "E" : "W");
    document.getElementById("valCoords").textContent = `${latStr}, ${lonStr}`;
  } else {
    document.getElementById("valCoords").textContent = "Locating...";
  }

  // Accuracy
  if (fx && fx.accuracy != null) {
    document.getElementById("valAcc").textContent = `±${Math.round(fx.accuracy)} m`;
  } else {
    document.getElementById("valAcc").textContent = "—";
  }

  // Battery
  if (lp.battery != null) {
    document.getElementById("valBat").textContent = `${Math.round(lp.battery)}%`;
  } else {
    document.getElementById("valBat").textContent = "—";
  }

  // Last update time
  document.getElementById("valAgo").textContent = formatAgo(d.last_seen, now);
}

function updateLocationOnMap(d) {
  const pos = d.last_fix || d.last_ping;
  if (!pos || pos.lat == null || pos.lon == null) return;

  const latLng = [pos.lat, pos.lon];
  const acc = pos.accuracy || 20;

  if (!beaconMarker) {
    beaconMarker = L.marker(latLng, { icon: beaconIcon }).addTo(map);
    accuracyCircle = L.circle(latLng, {
      radius: acc,
      color: "#3b82f6",
      weight: 1.5,
      opacity: 0.6,
      fillColor: "#60a5fa",
      fillOpacity: 0.12
    }).addTo(map);

    if (!hasAutoCentered) {
      map.setView(latLng, 16);
      hasAutoCentered = true;
    }
  } else {
    beaconMarker.setLatLng(latLng);
    accuracyCircle.setLatLng(latLng);
    accuracyCircle.setRadius(acc);
  }

  if (showTrail) {
    loadTrail(d.id);
  }
}

function centerOnDevice() {
  if (!currentDevice) return;
  const pos = currentDevice.last_fix || currentDevice.last_ping;
  if (pos && pos.lat != null) {
    map.flyTo([pos.lat, pos.lon], 16, { animate: true, duration: 1.2 });
    showToast("Centered on live location");
  } else {
    showToast("Waiting for location fix...");
  }
}

async function toggleTrail() {
  showTrail = !showTrail;
  const btn = document.getElementById("trailBtn");
  btn.classList.toggle("active", showTrail);

  if (!showTrail) {
    if (trailPolyline) {
      map.removeLayer(trailPolyline);
      trailPolyline = null;
    }
  } else if (currentDevice) {
    loadTrail(currentDevice.id);
  }
}

async function loadTrail(deviceId) {
  try {
    const res = await fetch(`/api/track/${encodeURIComponent(deviceId)}`, {
      headers: { Authorization: "Bearer " + TOKEN }
    });
    const data = await res.json();
    const pts = (data.track || [])
      .filter(p => p.lat != null && p.lon != null)
      .map(p => [p.lat, p.lon]);

    if (trailPolyline) map.removeLayer(trailPolyline);
    if (pts.length > 1) {
      trailPolyline = L.polyline(pts, {
        color: "#38bdf8",
        weight: 3.5,
        opacity: 0.8,
        dashArray: "4, 6"
      }).addTo(map);
    }
  } catch (err) {}
}

async function sendSnapshot() {
  if (!currentDevice) return;
  try {
    showToast("Triggering remote camera snapshot...");
    await fetch("/api/command", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ device_id: currentDevice.id, cmd: "snap" })
    });
    showToast("Snapshot command queued for phone");
    refreshState();
  } catch (err) {
    showToast("Failed to queue snapshot");
  }
}

async function cycleTrackingRate() {
  if (!currentDevice) return;
  const currentIndex = rateOptions.indexOf(currentRateSec);
  const nextIndex = (currentIndex + 1) % rateOptions.length;
  currentRateSec = rateOptions[nextIndex];
  const rateLabelStr = currentRateSec >= 60 ? `${currentRateSec / 60}m` : `${currentRateSec}s`;
  document.getElementById("rateLabel").textContent = rateLabelStr;

  try {
    await fetch(`/api/device/${encodeURIComponent(currentDevice.id)}/interval`, {
      method: "POST",
      headers: {
        Authorization: "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ sec: currentRateSec })
    });
    showToast(`Tracking rate set to ${rateLabelStr}`);
    refreshState();
  } catch (err) {
    showToast("Failed to set tracking rate");
  }
}

async function ringDevice() {
  if (!currentDevice) return;
  try {
    await fetch("/api/command", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ device_id: currentDevice.id, cmd: "ring" })
    });
    showToast("Ring command sent to phone");
  } catch (err) {
    showToast("Failed to send ring command");
  }
}

function updateEvents(events) {
  const el = document.getElementById("eventsList");
  document.getElementById("eventCount").textContent = events.length;
  if (!events || events.length === 0) {
    el.innerHTML = '<p style="color:var(--txt-muted);font-size:12px;padding:16px 0;">No activity recorded yet.</p>';
    return;
  }

  const iconMap = {
    snapshot: "📸",
    frame: "📸",
    command: "⚡",
    sos: "🚨",
    offline: "⚠️",
    geofence: "📍"
  };

  el.innerHTML = events.slice(0, 30).map(ev => {
    const icon = iconMap[ev.type] || "•";
    const sevClass = ev.severity || "info";
    const timeStr = new Date(ev.ts * 1000).toLocaleTimeString();
    return `
      <div class="event-item ${sevClass}">
        <div class="event-icon">${icon}</div>
        <div class="event-content">
          <div class="event-title">${escapeHtml(ev.message)}</div>
          <div class="event-time">${timeStr}</div>
        </div>
      </div>
    `;
  }).join("");
}

function updatePhotos(frames) {
  const container = document.getElementById("photosContainer");
  const count = frames.length;
  document.getElementById("photoCount").textContent = count;
  document.getElementById("drawerPhotoCount").textContent = count;

  if (!frames || frames.length === 0) {
    container.innerHTML = '<p style="color:var(--txt-muted);font-size:12px;padding:20px 0;">No snapshots received yet. Tap "📸 Snapshot" above.</p>';
    return;
  }

  container.innerHTML = frames.map(f => {
    const url = `/frames/${encodeURIComponent(f.path)}?token=${encodeURIComponent(TOKEN)}`;
    return `
      <img class="photo-thumb" src="${url}" loading="lazy" alt="${escapeHtml(f.kind)}" onclick="openLightbox('${url}')">
    `;
  }).join("");
}

function toggleDrawer() {
  drawerOpen = !drawerOpen;
  document.getElementById("drawer").classList.toggle("open", drawerOpen);
}

function switchDrawerTab(tab) {
  document.getElementById("tabPhotosBtn").classList.toggle("active", tab === "photos");
  document.getElementById("tabEventsBtn").classList.toggle("active", tab === "events");
  document.getElementById("photosView").style.display = tab === "photos" ? "block" : "none";
  document.getElementById("eventsView").style.display = tab === "events" ? "block" : "none";
}

function openLightbox(url) {
  document.getElementById("lightboxImg").src = url;
  document.getElementById("lightbox").classList.add("active");
}

function closeLightbox(e) {
  if (e && e.target && e.target.id === "lightboxImg") return;
  document.getElementById("lightbox").classList.remove("active");
}

function formatAgo(ts, now) {
  if (!ts) return "never";
  const s = Math.max(0, Math.floor(now - ts));
  if (s < 5) return "Just now";
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ago`;
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3200);
}

// WebSocket Live Updates
function connectWebSocket() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.kind === "ping" || msg.kind === "refresh" || msg.kind === "frame" || msg.kind === "event") {
        refreshState();
      }
    } catch (err) {}
  };

  ws.onclose = () => {
    setTimeout(connectWebSocket, 4000);
  };
}
</script>
</body>
