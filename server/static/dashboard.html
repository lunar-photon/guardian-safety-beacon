<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardian — Live Telemetry</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg-base: #090d16;
    --card-bg: rgba(15, 23, 42, 0.88);
    --card-border: rgba(255, 255, 255, 0.12);
    --txt-main: #f8fafc;
    --txt-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --online-green: #22c55e;
    --offline-red: #ef4444;
    --warn-amber: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-base); color: var(--txt-main); }

  #map {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    background: #0f172a;
  }

  /* Live Pulsing Dot Marker */
  .custom-beacon-icon {
    background: transparent;
    border: none;
  }
  .live-beacon {
    position: relative;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .live-beacon-core {
    width: 14px;
    height: 14px;
    background: #2563eb;
    border: 2.5px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 14px rgba(37, 99, 235, 0.9), 0 2px 5px rgba(0,0,0,0.4);
    z-index: 2;
  }
  .live-beacon-ring {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: rgba(37, 99, 235, 0.28);
    border: 1.5px solid rgba(59, 130, 246, 0.6);
    animation: live-beacon-pulse 2s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes live-beacon-pulse {
    0% { transform: scale(0.35); opacity: 0.95; }
    70% { transform: scale(1.35); opacity: 0.2; }
    100% { transform: scale(1.75); opacity: 0; }
  }

  /* Floating HUD Panels */
  .hud-panel {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 1000;
    width: min(92vw, 350px);
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    transition: all 0.3s ease;
  }

  .hud-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .hud-title-box {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .device-icon {
    font-size: 20px;
    background: rgba(255, 255, 255, 0.08);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .device-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--txt-main);
    letter-spacing: -0.01em;
  }
  .device-id {
    font-size: 11px;
    color: var(--txt-muted);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #4ade80;
  }
  .status-badge.offline {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.3);
    color: #f87171;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .metric-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .metric-label {
    font-size: 11px;
    color: var(--txt-muted);
    margin-bottom: 2px;
  }
  .metric-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--txt-main);
  }

  /* Controls row */
  .actions-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn-action {
    flex: 1;
    min-width: 70px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 9px 8px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    color: var(--txt-main);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-action:hover {
    background: rgba(255, 255, 255, 0.14);
    border-color: var(--accent);
  }
  .btn-action.active {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: #ffffff;
  }
  .btn-primary {
    background: #2563eb;
    border-color: #3b82f6;
    color: #ffffff;
  }
  .btn-primary:hover {
    background: #1d4ed8;
  }

  /* Right Side Activity & Snapshots Card */
  .activity-panel {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 1000;
    width: min(92vw, 360px);
    max-height: calc(100vh - 40px);
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .activity-panel.collapsed {
    max-height: 52px;
  }
  .activity-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--card-border);
  }
  .tab-buttons {
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, 0.06);
    padding: 3px;
    border-radius: 10px;
  }
  .tab-btn {
    padding: 5px 12px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--txt-muted);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    font-weight: 600;
  }
  .collapse-btn {
    background: transparent;
    border: none;
    color: var(--txt-muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .collapse-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
  }

  .panel-body {
    padding: 12px 16px 16px;
    overflow-y: auto;
    max-height: calc(100vh - 120px);
  }
  .panel-body::-webkit-scrollbar { width: 5px; }
  .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  /* Event item */
  .event-item {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 12px;
    line-height: 1.4;
  }
  .event-icon {
    font-size: 16px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .event-content {
    flex: 1;
  }
  .event-title {
    color: var(--txt-main);
    font-weight: 500;
  }
  .event-time {
    color: var(--txt-muted);
    font-size: 11px;
    margin-top: 2px;
  }
  .event-item.critical {
    border-left: 3px solid var(--offline-red);
  }
  .event-item.warn {
    border-left: 3px solid var(--warn-amber);
  }
  .event-item.info {
    border-left: 3px solid var(--accent);
  }

  /* Photos Grid */
  .photos-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .photo-card {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    aspect-ratio: 3/4;
    background: #0b1220;
    cursor: pointer;
  }
  .photo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.25s ease;
  }
  .photo-card:hover .photo-img {
    transform: scale(1.05);
  }
  .photo-tag {
    position: absolute;
    bottom: 6px;
    left: 6px;
    right: 6px;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(6px);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 10px;
    color: #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Lightbox Modal */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 3000;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #lightbox.active {
    display: flex;
  }
  .lightbox-content {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 28px;
    font-size: 28px;
    color: #ffffff;
    background: transparent;
    border: none;
    cursor: pointer;
  }

  /* Status message banner */
  #toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4000;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 13px;
    color: #fff;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #toast.show {
    opacity: 1;
  }

  @media (max-width: 768px) {
    .hud-panel {
      top: 12px;
      left: 12px;
      right: 12px;
      width: auto;
    }
    .activity-panel {
      top: auto;
      bottom: 12px;
      right: 12px;
      left: 12px;
      width: auto;
      max-height: 40vh;
    }
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- Left HUD: Device Info & Location -->
<div class="hud-panel" id="hud">
  <div class="hud-header">
    <div class="hud-title-box">
      <div class="device-icon">📱</div>
      <div>
        <div class="device-title" id="devName">My Weather Phone</div>
        <div class="device-id" id="devId">dev-6b80ca5a</div>
      </div>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Live</span>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">Coordinates</div>
      <div class="metric-val" id="valCoords">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Accuracy</div>
      <div class="metric-val" id="valAcc">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Battery</div>
      <div class="metric-val" id="valBat">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Last Signal</div>
      <div class="metric-val" id="valAgo">Just now</div>
    </div>
  <div style="margin: 10px 0 12px; padding: 9px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 11px; color: var(--txt-muted); display: flex; align-items: center; gap: 6px;">
      <span>⏱️</span>
      <span>Tracking Rate</span>
    </div>
    <select id="intervalSelect" onchange="changeInterval(this.value)" style="background: rgba(15, 23, 42, 0.9); border: 1px solid var(--card-border); color: var(--txt-main); border-radius: 6px; padding: 4px 8px; font-size: 11px; outline: none; cursor: pointer;">
      <option value="3">⚡ 3s (Realtime)</option>
      <option value="5">⚡ 5s (High rate)</option>
      <option value="10" selected>⏱️ 10s (Standard)</option>
      <option value="30">🕒 30s (Balanced)</option>
      <option value="60">🔋 60s (Battery saver)</option>
      <option value="300">🌙 5m (Low power)</option>
    </select>
  </div>

  <div class="actions-row">
    <button class="btn-action btn-primary" onclick="centerOnDevice()" title="Center map on live location">
      🎯 Center
    </button>
    <button class="btn-action" id="trailBtn" onclick="toggleTrail()" title="Toggle historical route trail">
      📍 Trail
    </button>
    <button class="btn-action" onclick="sendSnapshot()" title="Capture photo remotely">
      📸 Snapshot
    </button>
    <button class="btn-action" onclick="ringDevice()" title="Ring the phone">
      🔔 Ring
    </button>
  </div>
</div>

<!-- Right Panel: Activity Timeline & Snapshot Photos -->
<div class="activity-panel" id="activityPanel">
  <div class="activity-header">
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabEventsBtn" onclick="switchTab('events')">⚡ Activity</button>
      <button class="tab-btn" id="tabPhotosBtn" onclick="switchTab('photos')">📸 Photos (<span id="photoCount">0</span>)</button>
    </div>
    <button class="collapse-btn" id="collapseBtn" onclick="togglePanelCollapse()" title="Minimize / Expand">_</button>
  </div>

  <div class="panel-body" id="panelBody">
    <div id="eventsView">
      <div id="eventsList"><p style="color:var(--txt-muted);font-size:12px;padding:12px 0;">Loading activity...</p></div>
    </div>
    <div id="photosView" style="display: none;">
      <div class="photos-grid" id="photosGrid">
        <p style="color:var(--txt-muted);font-size:12px;padding:12px 0;grid-column:span 2;">No snapshots received yet.</p>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox Modal -->
<div id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" class="lightbox-content" src="" alt="Full snapshot">
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const LS_TOKEN_KEY = "guardian_token";
let TOKEN = "";
let map, beaconMarker = null, accuracyCircle = null, trailPolyline = null;
let showTrail = false;
let currentDevice = null;
let hasAutoCentered = false;
let activeTab = "events";
let isPanelCollapsed = false;

// 1. Injected token from server or URL query param or localStorage
const urlParams = new URLSearchParams(window.location.search);
const injectedToken = "__DEFAULT_TOKEN__";
TOKEN = urlParams.get("token") || (!injectedToken.startsWith("__") ? injectedToken : "") || localStorage.getItem(LS_TOKEN_KEY) || "";

if (TOKEN) {
  localStorage.setItem(LS_TOKEN_KEY, TOKEN);
}

// Boot map and telemetry immediately
initMap();
refreshState();
connectWebSocket();
setInterval(refreshState, 5000); // Polling backup

function initMap() {
  map = L.map("map", {
    zoomControl: false,
    attributionControl: false
  }).setView([20, 0], 2);

  // 100% Free Open-Source OpenStreetMap Tiles (No API key needed)
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  L.control.zoom({ position: "bottomleft" }).addTo(map);
}

const beaconIcon = L.divIcon({
  className: "custom-beacon-icon",
  html: '<div class="live-beacon"><div class="live-beacon-ring"></div><div class="live-beacon-core"></div></div>',
  iconSize: [24, 24],
  iconAnchor: [12, 12]
});

async function refreshState() {
  try {
    const res = await fetch("/api/state", {
      headers: { Authorization: "Bearer " + TOKEN }
    });
    if (!res.ok) return;
    const data = await res.json();
    if (!data.devices || data.devices.length === 0) return;

    const dev = data.devices.find(d => d.id === "dev-6b80ca5a") || data.devices[0];
    currentDevice = dev;
    updateHUD(dev, data.now, data.offline_timeout);
    updateLocationOnMap(dev);
    updateEvents(data.events || []);
    updatePhotos(data.frames || []);
  } catch (err) {
    console.error("Refresh error:", err);
  }
}

function updateHUD(d, now, timeout) {
  document.getElementById("devName").textContent = d.name || "Device";
  document.getElementById("devId").textContent = d.id;

  const lp = d.last_ping || {};
  const fx = d.last_fix || lp;

  const isOnline = (now - (d.last_seen || 0)) < (timeout || 90);
  const badge = document.getElementById("statusBadge");
  const statusText = document.getElementById("statusText");

  if (isOnline) {
    badge.className = "status-badge";
    statusText.textContent = "Live";
  } else {
    badge.className = "status-badge offline";
    statusText.textContent = "Offline";
  }

  // Coordinates
  if (fx && fx.lat != null) {
    const latStr = Math.abs(fx.lat).toFixed(5) + "° " + (fx.lat >= 0 ? "N" : "S");
    const lonStr = Math.abs(fx.lon).toFixed(5) + "° " + (fx.lon >= 0 ? "E" : "W");
    document.getElementById("valCoords").textContent = `${latStr}, ${lonStr}`;
  } else {
    document.getElementById("valCoords").textContent = "Locating...";
  }

  // Accuracy
  if (fx && fx.accuracy != null) {
    document.getElementById("valAcc").textContent = `±${Math.round(fx.accuracy)} m`;
  } else {
    document.getElementById("valAcc").textContent = "—";
  }

  // Battery
  if (lp.battery != null) {
    document.getElementById("valBat").textContent = `${Math.round(lp.battery)}%`;
  } else {
    document.getElementById("valBat").textContent = "—";
  }

  // Last update time
  document.getElementById("valAgo").textContent = formatAgo(d.last_seen, now);
}

function updateLocationOnMap(d) {
  const pos = d.last_fix || d.last_ping;
  if (!pos || pos.lat == null || pos.lon == null) return;

  const latLng = [pos.lat, pos.lon];
  const acc = pos.accuracy || 20;

  if (!beaconMarker) {
    beaconMarker = L.marker(latLng, { icon: beaconIcon }).addTo(map);
    accuracyCircle = L.circle(latLng, {
      radius: acc,
      color: "#3b82f6",
      weight: 1.5,
      opacity: 0.6,
      fillColor: "#60a5fa",
      fillOpacity: 0.12
    }).addTo(map);

    if (!hasAutoCentered) {
      map.setView(latLng, 16);
      hasAutoCentered = true;
    }
  } else {
    beaconMarker.setLatLng(latLng);
    accuracyCircle.setLatLng(latLng);
    accuracyCircle.setRadius(acc);
  }

  if (showTrail) {
    loadTrail(d.id);
  }
}

function centerOnDevice() {
  if (!currentDevice) return;
  const pos = currentDevice.last_fix || currentDevice.last_ping;
  if (pos && pos.lat != null) {
    map.flyTo([pos.lat, pos.lon], 16, { animate: true, duration: 1.2 });
    showToast("Centered on live location");
  } else {
    showToast("Waiting for location fix...");
  }
}

async function toggleTrail() {
  showTrail = !showTrail;
  const btn = document.getElementById("trailBtn");
  btn.classList.toggle("active", showTrail);

  if (!showTrail) {
    if (trailPolyline) {
      map.removeLayer(trailPolyline);
      trailPolyline = null;
    }
  } else if (currentDevice) {
    loadTrail(currentDevice.id);
  }
}

async function loadTrail(deviceId) {
  try {
    const res = await fetch(`/api/track/${encodeURIComponent(deviceId)}`, {
      headers: { Authorization: "Bearer " + TOKEN }
    });
    const data = await res.json();
    const pts = (data.track || [])
      .filter(p => p.lat != null && p.lon != null)
      .map(p => [p.lat, p.lon]);

    if (trailPolyline) map.removeLayer(trailPolyline);
    if (pts.length > 1) {
      trailPolyline = L.polyline(pts, {
        color: "#38bdf8",
        weight: 3.5,
        opacity: 0.8,
        dashArray: "4, 6"
      }).addTo(map);
    }
  } catch (err) {}
}

async function sendSnapshot() {
  if (!currentDevice) return;
  try {
    showToast("Triggering remote snapshot...");
    await fetch("/api/command", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ device_id: currentDevice.id, cmd: "snap" })
    });
    showToast("Snapshot command queued for phone");
    // Switch to activity tab to see progress
    switchTab("events");
    refreshState();
  } catch (err) {
    showToast("Failed to queue snapshot command");
  }
}

async function ringDevice() {
  if (!currentDevice) return;
  try {
    await fetch("/api/command", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ device_id: currentDevice.id, cmd: "ring" })
    });
    showToast("Ring command queued for phone");
  } catch (err) {
    showToast("Failed to send ring command");
  }
}

async function changeInterval(sec) {
  if (!currentDevice) return;
  const s = parseInt(sec, 10);
  try {
    showToast(`Setting location rate to ${s}s...`);
    await fetch(`/api/device/${encodeURIComponent(currentDevice.id)}/interval`, {
      method: "POST",
      headers: {
        Authorization: "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ sec: s })
    });
    showToast(`Location update rate set to ${s}s`);
    refreshState();
  } catch (err) {
    showToast("Failed to set interval");
  }
}

function updateEvents(events) {
  const el = document.getElementById("eventsList");
  if (!events || events.length === 0) {
    el.innerHTML = '<p style="color:var(--txt-muted);font-size:12px;padding:12px 0;">No activity events recorded yet.</p>';
    return;
  }

  const iconMap = {
    snapshot: "📸",
    frame: "📸",
    command: "⚡",
    sos: "🚨",
    offline: "⚠️",
    geofence: "📍"
  };

  el.innerHTML = events.slice(0, 30).map(ev => {
    const icon = iconMap[ev.type] || "•";
    const sevClass = ev.severity || "info";
    const timeStr = new Date(ev.ts * 1000).toLocaleTimeString();
    return `
      <div class="event-item ${sevClass}">
        <div class="event-icon">${icon}</div>
        <div class="event-content">
          <div class="event-title">${escapeHtml(ev.message)}</div>
          <div class="event-time">${timeStr}</div>
        </div>
      </div>
    `;
  }).join("");
}

function updatePhotos(frames) {
  const grid = document.getElementById("photosGrid");
  document.getElementById("photoCount").textContent = frames.length;
  if (!frames || frames.length === 0) {
    grid.innerHTML = '<p style="color:var(--txt-muted);font-size:12px;padding:12px 0;grid-column:span 2;">No snapshots received yet.</p>';
    return;
  }

  grid.innerHTML = frames.map(f => {
    const url = `/frames/${encodeURIComponent(f.path)}?token=${encodeURIComponent(TOKEN)}`;
    const timeStr = new Date(f.ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `
      <div class="photo-card" onclick="openLightbox('${url}')">
        <img class="photo-img" src="${url}" loading="lazy" alt="${escapeHtml(f.kind)}">
        <div class="photo-tag">${timeStr} · ${escapeHtml(f.kind)}</div>
      </div>
    `;
  }).join("");
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById("tabEventsBtn").classList.toggle("active", tab === "events");
  document.getElementById("tabPhotosBtn").classList.toggle("active", tab === "photos");
  document.getElementById("eventsView").style.display = tab === "events" ? "block" : "none";
  document.getElementById("photosView").style.display = tab === "photos" ? "block" : "none";
  if (isPanelCollapsed) togglePanelCollapse();
}

function togglePanelCollapse() {
  const panel = document.getElementById("activityPanel");
  isPanelCollapsed = !isPanelCollapsed;
  panel.classList.toggle("collapsed", isPanelCollapsed);
  document.getElementById("collapseBtn").textContent = isPanelCollapsed ? "+" : "_";
}

function openLightbox(url) {
  document.getElementById("lightboxImg").src = url;
  document.getElementById("lightbox").classList.add("active");
}

function closeLightbox(e) {
  if (e && e.target && e.target.id === "lightboxImg") return;
  document.getElementById("lightbox").classList.remove("active");
}

function formatAgo(ts, now) {
  if (!ts) return "never";
  const s = Math.max(0, Math.floor(now - ts));
  if (s < 5) return "Just now";
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ago`;
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3200);
}

// WebSocket Live Updates
function connectWebSocket() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.kind === "ping" || msg.kind === "refresh" || msg.kind === "frame" || msg.kind === "event") {
        refreshState();
      }
    } catch (err) {}
  };

  ws.onclose = () => {
    setTimeout(connectWebSocket, 4000);
  };
}
