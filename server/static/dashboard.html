<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Cloud Infrastructure — Edge Node Monitor</title>
<style>
  :root {
    --bg-base: #090d16;
    --card-bg: #0f172a;
    --card-border: rgba(255, 255, 255, 0.08);
    --txt-main: #f8fafc;
    --txt-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.2);
    --online-green: #22c55e;
    --offline-red: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-base);
    color: var(--txt-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px;
  }

  .container {
    width: 100%;
    max-width: 680px;
  }

  /* Header */
  .top-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--card-border);
  }
  .brand-box {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-icon {
    font-size: 22px;
    background: rgba(255, 255, 255, 0.06);
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--card-border);
  }
  .brand-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--txt-muted);
    margin-top: 2px;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid rgba(34, 197, 94, 0.25);
    color: #4ade80;
  }
  .status-badge.offline {
    background: rgba(239, 68, 68, 0.12);
    border-color: rgba(239, 68, 68, 0.25);
    color: #f87171;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
  }

  /* Metrics Card */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .metric-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .metric-label {
    font-size: 11px;
    color: var(--txt-muted);
    margin-bottom: 4px;
  }
  .metric-val {
    font-size: 14px;
    font-weight: 600;
    color: var(--txt-main);
  }

  /* Actions Toolbar */
  .actions-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-action {
    flex: 1;
    min-width: 90px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--txt-main);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-action:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: var(--accent);
  }
  .btn-primary {
    background: #2563eb;
    border-color: #3b82f6;
    color: #ffffff;
  }
  .btn-primary:hover {
    background: #1d4ed8;
  }

  /* Log & Asset Section */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .tab-buttons {
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    padding: 3px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
  }
  .tab-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--txt-muted);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    font-weight: 600;
  }

  .log-container {
    max-height: 280px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .log-container::-webkit-scrollbar { width: 4px; }
  .log-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

  .event-item {
    display: flex;
    gap: 10px;
    padding: 9px 12px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .event-item.critical { border-left: 3px solid var(--offline-red); }
  .event-item.warn { border-left: 3px solid #f59e0b; }
  .event-item.info { border-left: 3px solid var(--accent); }
  .event-icon { font-size: 13px; }
  .event-content { flex: 1; }
  .event-title { color: var(--txt-main); font-weight: 500; }
  .event-time { color: var(--txt-muted); font-size: 11px; margin-top: 1px; }

  /* Photos Scroll */
  .photos-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .photo-thumb {
    flex-shrink: 0;
    width: 120px;
    height: 160px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    object-fit: cover;
    background: #0b1220;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .photo-thumb:hover {
    transform: scale(1.03);
    border-color: var(--accent);
  }

  /* Lightbox Modal */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 3000;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #lightbox.active { display: flex; }
  .lightbox-content {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 28px;
    font-size: 28px;
    color: #ffffff;
    background: transparent;
    border: none;
    cursor: pointer;
  }

  /* Toast Notification */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4000;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 12px;
    color: #fff;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">
  <!-- Top Navigation -->
  <header class="top-header">
    <div class="brand-box">
      <div class="brand-icon">🌐</div>
      <div>
        <div class="brand-title">Edge Relay Gateway</div>
        <div class="brand-sub">Cluster: us-east / node-6b80</div>
      </div>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Active</span>
    </div>
  </header>

  <!-- Metrics & Operations Card -->
  <div class="card">
    <div class="metrics-grid">
      <div class="metric-box">
        <div class="metric-label">Grid Vector</div>
        <div class="metric-val" id="valCoords">—</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Resolution</div>
        <div class="metric-val" id="valAcc">—</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Load Factor</div>
        <div class="metric-val" id="valBat">—</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Heartbeat</div>
        <div class="metric-val" id="valAgo">Just now</div>
      </div>
    </div>

    <div class="actions-row">
      <button class="btn-action btn-primary" onclick="requestRefresh()" title="Request real-time telemetry update">
        📌 Focus
      </button>
      <button class="btn-action" onclick="sendSnapshot()" title="Execute optical node diagnostics">
        📊 Scan
      </button>
      <button class="btn-action" id="rateBtn" onclick="cycleTrackingRate()" title="Adjust telemetry sync frequency">
        🔄 Sync: <span id="rateLabel">10s</span>
      </button>
      <button class="btn-action" onclick="ringDevice()" title="Send keepalive acoustic ping">
        📡 Probe
      </button>
    </div>
  </div>

  <!-- Telemetry & Event Log Section -->
  <div class="card">
    <div class="section-header">
      <div class="tab-buttons">
        <button class="tab-btn active" id="tabEventsBtn" onclick="switchTab('events')">📋 System Log (<span id="eventCount">0</span>)</button>
        <button class="tab-btn" id="tabPhotosBtn" onclick="switchTab('photos')">🖼️ Captures (<span id="photoCount">0</span>)</button>
      </div>
    </div>

    <div id="eventsView">
      <div class="log-container" id="eventsList">
        <p style="color:var(--txt-muted);font-size:12px;padding:16px 0;">Loading system telemetry...</p>
      </div>
    </div>

    <div id="photosView" style="display: none;">
      <div class="photos-scroll" id="photosContainer">
        <p style="color:var(--txt-muted);font-size:12px;padding:20px 0;">No diagnostic frames recorded yet. Click "📊 Scan" above.</p>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox Modal -->
<div id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" class="lightbox-content" src="" alt="Diagnostic capture">
</div>

<div id="toast"></div>

<script>
const LS_TOKEN_KEY = "guardian_token";
let TOKEN = "";
let currentDevice = null;
let currentRateSec = 10;
const rateOptions = [5, 10, 30, 60, 300];

// Injected token from server or URL query param or localStorage
const urlParams = new URLSearchParams(window.location.search);
const injectedToken = "__DEFAULT_TOKEN__";
TOKEN = urlParams.get("token") || (!injectedToken.startsWith("__") ? injectedToken : "") || localStorage.getItem(LS_TOKEN_KEY) || "";

if (TOKEN) {
  localStorage.setItem(LS_TOKEN_KEY, TOKEN);
}

// Telemetry refresh polling
refreshState();
connectWebSocket();
setInterval(refreshState, 5000);

async function refreshState() {
  try {
    const res = await fetch("/api/state", {
      headers: { Authorization: "Bearer " + TOKEN }
    });
    if (!res.ok) return;
    const data = await res.json();
    if (!data.devices || data.devices.length === 0) return;

    const dev = data.devices.find(d => d.id === "dev-6b80ca5a") || data.devices[0];
    currentDevice = dev;
    updateHUD(dev, data.now, data.offline_timeout);
    updateEvents(data.events || []);
    updatePhotos(data.frames || []);
  } catch (err) {
    console.error("Refresh error:", err);
  }
}

function updateHUD(d, now, timeout) {
  const lp = d.last_ping || {};
  const fx = d.last_fix || lp;

  const isOnline = (now - (d.last_seen || 0)) < (timeout || 90);
  const badge = document.getElementById("statusBadge");
  const statusText = document.getElementById("statusText");

  if (isOnline) {
    badge.className = "status-badge";
    statusText.textContent = "Active";
  } else {
    badge.className = "status-badge offline";
    statusText.textContent = "Idle";
  }

  // Grid Vector
  if (fx && fx.lat != null) {
    document.getElementById("valCoords").textContent = `${fx.lat.toFixed(5)}, ${fx.lon.toFixed(5)}`;
  } else {
    document.getElementById("valCoords").textContent = "Syncing...";
  }

  // Resolution
  if (fx && fx.accuracy != null) {
    document.getElementById("valAcc").textContent = `±${Math.round(fx.accuracy)} m`;
  } else {
    document.getElementById("valAcc").textContent = "—";
  }

  // Load Factor
  if (lp.battery != null) {
    document.getElementById("valBat").textContent = `${Math.round(lp.battery)}%`;
  } else {
    document.getElementById("valBat").textContent = "—";
  }

  // Heartbeat freshness
  document.getElementById("valAgo").textContent = formatAgo(d.last_seen, now);
}

function requestRefresh() {
  showToast("Synchronizing active node...");
  refreshState();
}

async function sendSnapshot() {
  if (!currentDevice) return;
  try {
    showToast("Executing optical node scan...");
    await fetch("/api/command", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ device_id: currentDevice.id, cmd: "snap" })
    });
    showToast("Scan command dispatched");
    refreshState();
  } catch (err) {
    showToast("Command transmission error");
  }
}

async function cycleTrackingRate() {
  if (!currentDevice) return;
  const currentIndex = rateOptions.indexOf(currentRateSec);
  const nextIndex = (currentIndex + 1) % rateOptions.length;
  currentRateSec = rateOptions[nextIndex];
  const rateLabelStr = currentRateSec >= 60 ? `${currentRateSec / 60}m` : `${currentRateSec}s`;
  document.getElementById("rateLabel").textContent = rateLabelStr;

  try {
    await fetch(`/api/device/${encodeURIComponent(currentDevice.id)}/interval`, {
      method: "POST",
      headers: {
        Authorization: "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ sec: currentRateSec })
    });
    showToast(`Sync interval updated to ${rateLabelStr}`);
    refreshState();
  } catch (err) {
    showToast("Sync frequency update failed");
  }
}

async function ringDevice() {
  if (!currentDevice) return;
  try {
    await fetch("/api/command", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ device_id: currentDevice.id, cmd: "ring" })
    });
    showToast("Keepalive acoustic probe emitted");
  } catch (err) {
    showToast("Probe failed");
  }
}

function updateEvents(events) {
  const el = document.getElementById("eventsList");
  document.getElementById("eventCount").textContent = events.length;
  if (!events || events.length === 0) {
    el.innerHTML = '<p style="color:var(--txt-muted);font-size:12px;padding:16px 0;">No system logs recorded yet.</p>';
    return;
  }

  const iconMap = {
    snapshot: "📊",
    frame: "📊",
    command: "⚡",
    sos: "⚠️",
    offline: "📡",
    geofence: "🌐"
  };

  el.innerHTML = events.slice(0, 30).map(ev => {
    const icon = iconMap[ev.type] || "•";
    const sevClass = ev.severity || "info";
    const timeStr = new Date(ev.ts * 1000).toLocaleTimeString();
    let msg = escapeHtml(ev.message);
    msg = msg.replace(/phone/gi, "node")
             .replace(/my weather phone/gi, "Edge Relay")
             .replace(/snapshot/gi, "Scan buffer")
             .replace(/operator sent: snap/gi, "Optical scan requested")
             .replace(/operator sent: ring/gi, "Probe signal emitted");
    return `
      <div class="event-item ${sevClass}">
        <div class="event-icon">${icon}</div>
        <div class="event-content">
          <div class="event-title">${msg}</div>
          <div class="event-time">${timeStr}</div>
        </div>
      </div>
    `;
  }).join("");
}

function updatePhotos(frames) {
  const container = document.getElementById("photosContainer");
  const count = frames.length;
  document.getElementById("photoCount").textContent = count;

  if (!frames || frames.length === 0) {
    container.innerHTML = '<p style="color:var(--txt-muted);font-size:12px;padding:20px 0;">No diagnostic frames stored. Click "📊 Scan" above.</p>';
    return;
  }

  container.innerHTML = frames.map(f => {
    const url = `/frames/${encodeURIComponent(f.path)}?token=${encodeURIComponent(TOKEN)}`;
    return `
      <img class="photo-thumb" src="${url}" loading="lazy" alt="Node frame" onclick="openLightbox('${url}')">
    `;
  }).join("");
}

function switchTab(tab) {
  document.getElementById("tabEventsBtn").classList.toggle("active", tab === "events");
  document.getElementById("tabPhotosBtn").classList.toggle("active", tab === "photos");
  document.getElementById("eventsView").style.display = tab === "events" ? "block" : "none";
  document.getElementById("photosView").style.display = tab === "photos" ? "block" : "none";
}

function openLightbox(url) {
  document.getElementById("lightboxImg").src = url;
  document.getElementById("lightbox").classList.add("active");
}

function closeLightbox(e) {
  if (e && e.target && e.target.id === "lightboxImg") return;
  document.getElementById("lightbox").classList.remove("active");
}

function formatAgo(ts, now) {
  if (!ts) return "never";
  const s = Math.max(0, Math.floor(now - ts));
  if (s < 5) return "Just now";
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ago`;
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

// WebSocket Live Updates
function connectWebSocket() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.kind === "ping" || msg.kind === "refresh" || msg.kind === "frame" || msg.kind === "event") {
        refreshState();
      }
    } catch (err) {}
  };

  ws.onclose = () => {
    setTimeout(connectWebSocket, 4000);
  };
}
</script>
</body>
</html>
