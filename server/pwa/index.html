<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Notes</title><!-- decoy -->
<link rel="manifest" href="/pwa/manifest.webmanifest">
<link rel="icon" href="/pwa/icon.svg">
<style>
  :root{--bg:#0e1116;--panel:#161b22;--line:#2a323d;--txt:#e6edf3;--muted:#8b98a5;
    --accent:#4f9dff;--crit:#ff4d4f;--ok:#39d98a}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;
    letter-spacing:.05em}
  input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:12px;font:inherit}
  button{font:inherit;border:0;border-radius:12px;padding:14px;width:100%;font-weight:600;
    cursor:pointer;margin-top:12px}
  .primary{background:var(--accent);color:#06121f}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .hint{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}
  h1{font-size:19px;margin:6px 0 2px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  video,canvas{display:none}

  /* DECOY: looks like a plain notes app, silently broadcasting underneath */
  #decoy{flex:1;display:none;flex-direction:column}
  #decoy .bar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px}
  #decoy .bar .t{font-size:22px;font-weight:700}
  #decoy textarea{flex:1;min-height:70vh;resize:none;border:none;background:transparent;
    font-size:16px;line-height:1.6;outline:none}
  .tinydot{width:7px;height:7px;border-radius:50%;background:transparent}
  .tinydot.live{background:var(--ok)} /* only shows if you know to look */
</style>
</head>
<body>
<div class="wrap">
  <!-- FIRST-RUN SETUP / PAIRING (hidden once paired) -->
  <section id="setup" style="display:none">
    <h1>🛡️ Pair this phone</h1>
    <p class="hint">On your dashboard tap <b>“Pair a device”</b> and scan its QR, or type the
       code below. After pairing the phone goes silent and just broadcasts. Reopen this
       screen later: <b>triple-tap the word “Notes.”</b></p>
    <label>Pairing code</label>
    <input id="code" placeholder="6-letter code" autocapitalize="characters" autocomplete="off">
    <label>This device's name</label>
    <input id="name" placeholder="e.g. Arushi's phone">
    <button class="primary" id="save">Pair & go silent</button>
    <p class="hint" id="setupMsg"></p>
    <div class="row" style="margin-top:6px">
      <button class="ghost" id="setHome">🏠 Set Home (here)</button>
      <button class="ghost" id="setOffice">🏢 Set Office (here)</button>
    </div>
    <details style="margin-top:12px">
      <summary class="hint">Advanced (manual token instead of pairing)</summary>
      <label>Server URL</label>
      <input id="server" placeholder="https://xxxx.ngrok-free.app">
      <label>Token</label>
      <input id="token" type="password" placeholder="SAFETY_TOKEN">
      <label>Ping interval (seconds)</label>
      <input id="interval" type="number" value="10" min="3">
    </details>
    <button class="ghost" id="stopBtn" style="margin-top:10px;color:var(--muted)">Stop broadcasting</button>
  </section>

  <!-- DECOY running screen -->
  <section id="decoy">
    <div class="bar">
      <span class="t" id="brand">Notes</span>
      <span class="tinydot" id="livedot"></span>
    </div>
    <textarea id="pad" placeholder="Write a note…"></textarea>
  </section>
</div>

<video id="cam" playsinline muted></video>
<canvas id="canvas"></canvas>

<script src="/pwa/app.js"></script>
</body>
</html>
